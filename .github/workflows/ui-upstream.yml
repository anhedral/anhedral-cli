name: Review shadcn upstream (manual)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Upstream branch or commit to inventory
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ui-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch source for static review
        env:
          UPSTREAM_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          node --input-type=module -e 'const value=process.env.UPSTREAM_REVISION; if(!/^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,199}$/.test(value??"")||value.includes(".."))process.exit(1);'
          git clone --filter=blob:none --depth 1 --sparse https://github.com/anhedral/shadcn-ui.git "$RUNNER_TEMP/shadcn-ui"
          git -C "$RUNNER_TEMP/shadcn-ui" remote add upstream https://github.com/shadcn-ui/ui.git
          git -C "$RUNNER_TEMP/shadcn-ui" fetch --no-tags --depth 1 upstream "$UPSTREAM_REVISION"
          git -C "$RUNNER_TEMP/shadcn-ui" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/shadcn-ui" sparse-checkout set apps/v4/registry apps/v4/public/r
      - name: Inventory and compare without executing upstream code
        shell: bash
        run: |
          mkdir -p .artifacts/ui-upstream
          cp assets/ui/official/inventory.json.gz .artifacts/ui-upstream/previous-inventory.json.gz
          node scripts/shadcn-registry.mjs --snapshot "$RUNNER_TEMP/shadcn-ui"
          cp assets/ui/official/inventory.json.gz .artifacts/ui-upstream/inventory.json.gz
          node scripts/shadcn-registry.mjs --diff .artifacts/ui-upstream/previous-inventory.json.gz > .artifacts/ui-upstream/changes.json
      - name: Compare public APIs and source variants
        run: node scripts/shadcn-registry.mjs --api --report > .artifacts/ui-upstream/native-api.json
      - name: Compare font and theme evidence
        if: success() || failure()
        run: |
          node scripts/shadcn-fonts.mjs
          node scripts/shadcn-themes.mjs
          node scripts/native-chart-recipes.mjs --check
          node scripts/native-form-recipes.mjs --check
          node scripts/native-example-recipes.mjs --check
          node scripts/native-icons.mjs
          node scripts/shadcn-colors.mjs
          node scripts/native-utility-colors.mjs
      - name: Compare native component preset evidence
        if: success() || failure()
        run: node scripts/native-component-styles.mjs --report > .artifacts/ui-upstream/native-component-styles.json
      - name: Reject stale native parity evidence
        if: success() || failure()
        run: node scripts/shadcn-registry.mjs --write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shadcn-upstream-review
          path: .artifacts/ui-upstream/
          retention-days: 7
          if-no-files-found: warn
