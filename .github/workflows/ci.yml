name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    needs: plugin-ui
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.12.0'
          - '24.18.0'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build initializer
        run: pnpm build

      - name: Restore verified plugin runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-runtime
          path: plugins/anhedral/runtime

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check source hygiene and static security policy
        if: ${{ matrix.node == '20.19.0' }}
        run: pnpm lint && pnpm check:security

      - name: Audit dependencies
        if: ${{ matrix.node == '20.19.0' }}
        run: pnpm audit:osv

      - name: Smoke test packed CLI
        if: ${{ matrix.node != '22.12.0' }}
        run: node tests/test-packed-cli.js

      - name: Enforce package allowlist
        if: ${{ matrix.node == '20.19.0' }}
        run: node tests/test-packlist.js

  e2e-stable:
    name: E2E Stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && node tests/test-packed-cli.js

  portable:
    name: Portable CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['20.19.0', '22.12.0', '24.18.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test tests/test-cli-validation.test.mjs tests/test-standard.test.mjs tests/test-util-exec.test.mjs
      - run: node tests/test-packed-cli.js
      - name: Verify native Windows bootstrap guard
        if: runner.os == 'Windows'
        run: node tests/test-generated-apps.mjs web

  plugin-ui:
    name: Plugin UI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.18.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: plugin-app/pnpm-lock.yaml
      - run: pnpm --dir plugin-app install --frozen-lockfile
      - run: pnpm plugin:check
      - run: pnpm --dir plugin-app audit --audit-level low
      - name: Share verified runtime with portable CLI checks
        if: ${{ matrix.node == '24.18.0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-runtime
          path: plugins/anhedral/runtime
          if-no-files-found: error
          retention-days: 1

  registry-matrix:
    name: Registry matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: profiles
        run: |
          node --input-type=module -e "import { STACK_PROFILES } from './tests/support/stack-profiles.mjs'; console.log('profiles=' + JSON.stringify(Object.keys(STACK_PROFILES)))" >> "$GITHUB_OUTPUT"

  generated:
    name: Generated (${{ matrix.os }}, ${{ matrix.profile }}, Node ${{ matrix.node }})
    needs: registry-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        profile: ${{ fromJSON(needs.registry-matrix.outputs.profiles) }}
        node: ['22.13.0', '24.18.0']
        include:
          - { os: macos-latest, profile: desktop, node: '24.18.0' }
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tests/test-generated-apps.mjs ${{ matrix.profile }}
