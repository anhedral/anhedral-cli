name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs

  checks:
    needs: [scope, plugin-ui]
    if: ${{ !cancelled() }}
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22.12.0'
          - '24.18.0'
          - '24.21.0'
    steps:
      - name: Documentation-only check
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.full == 'false' }}
        run: echo 'Documentation-only change; build and test steps are not needed.'

      - name: Require successful scope and plugin checks
        if: ${{ needs.scope.result != 'success' || (needs.scope.outputs.full == 'true' && needs.plugin-ui.result != 'success') }}
        run: exit 1

      - name: Checkout
        if: ${{ needs.scope.outputs.full == 'true' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ needs.scope.outputs.full == 'true' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        if: ${{ needs.scope.outputs.full == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.scope.outputs.full == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build initializer
        if: ${{ needs.scope.outputs.full == 'true' }}
        run: pnpm build

      - name: Restore verified plugin runtime
        if: ${{ needs.scope.outputs.full == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-runtime
          path: plugins/codex/distribution/runtime

      - name: Run unit tests
        if: ${{ needs.scope.outputs.full == 'true' }}
        run: pnpm test:unit

      - name: Verify reviewed dependency patches and preserve advisory visibility
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '24.21.0') }}
        run: pnpm test:patch

      - name: Check source hygiene and static security policy
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '20.19.0') }}
        run: pnpm lint && pnpm check:security

      - name: Audit dependencies
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '20.19.0') }}
        run: pnpm audit:osv

      - name: Smoke test packed CLI
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node != '22.12.0') }}
        run: node tests/test-packed-cli.js

      - name: Enforce package allowlist
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '20.19.0') }}
        run: node tests/test-packlist.js

      - name: Build and verify Linux release candidate
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '24.21.0') }}
        run: |
          node scripts/create-release-artifact.mjs
          pnpm release:artifact:verify
          pnpm release:artifact:smoke

      - name: Share verified release candidate for review
        if: ${{ needs.scope.outputs.full == 'true' && (matrix.node == '24.21.0') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  e2e-stable:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    name: E2E Stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && node tests/test-packed-cli.js

  portable:
    needs: scope
    if: ${{ !cancelled() }}
    name: Portable CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['20.19.0', '22.12.0', '24.18.0', '24.21.0']
    steps:
      - name: Documentation-only check
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.full == 'false' }}
        run: echo 'Documentation-only change; build and test steps are not needed.'

      - name: Require successful scope detection
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: ${{ needs.scope.outputs.full == 'true' }}
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: ${{ needs.scope.outputs.full == 'true' }}
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ needs.scope.outputs.full == 'true' }}
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.scope.outputs.full == 'true' }}
      - run: pnpm build
        if: ${{ needs.scope.outputs.full == 'true' }}
      - run: node --test tests/test-cli-validation.test.mjs tests/test-standard.test.mjs tests/test-util-exec.test.mjs
        if: ${{ needs.scope.outputs.full == 'true' }}
      - run: node tests/test-packed-cli.js
        if: ${{ needs.scope.outputs.full == 'true' }}
      - name: Verify native Windows bootstrap guard
        if: ${{ needs.scope.outputs.full == 'true' && (runner.os == 'Windows') }}
        run: node tests/test-generated-apps.mjs web

  plugin-ui:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    name: Plugin UI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.21.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: plugins/codex/inspector/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir plugins/codex/inspector install --frozen-lockfile
      - run: pnpm plugin:check
      - run: pnpm --dir plugins/codex/inspector audit --audit-level low
      - name: Install dashboard test browser
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm --dir plugins/codex/inspector exec playwright install --with-deps chromium
      - name: Test dashboard interactions and responsive themes
        if: ${{ matrix.node == '24.21.0' }}
        run: pnpm --dir plugins/codex/inspector test:browser
      - name: Share verified runtime with portable CLI checks
        if: ${{ matrix.node == '24.21.0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-runtime
          path: plugins/codex/distribution/runtime
          if-no-files-found: error
          retention-days: 1

  registry-matrix:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    name: Registry matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - id: profiles
        run: |
          node --input-type=module -e "import { STACK_PROFILES } from './tests/support/stack-profiles.mjs'; console.log('profiles=' + JSON.stringify(Object.keys(STACK_PROFILES)))" >> "$GITHUB_OUTPUT"

  generated:
    name: Generated (${{ matrix.os }}, ${{ matrix.profile }}, Node ${{ matrix.node }})
    needs: [scope, registry-matrix]
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        profile: ${{ fromJSON(needs.registry-matrix.outputs.profiles) }}
        node: ['24.21.0']
        include:
          - { os: macos-latest, profile: desktop, node: '24.21.0' }
    env:
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tests/test-generated-apps.mjs ${{ matrix.profile }}
