name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_call:
    outputs:
      cli_integrity:
        value: ${{ jobs.gate.outputs.cli_integrity }}
      plugin_integrity:
        value: ${{ jobs.gate.outputs.plugin_integrity }}
  workflow_dispatch:
    inputs:
      runtime_proof:
        description: Build and test a disposable Anhedral Stack application
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: .

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cli_integrity: ${{ steps.identity.outputs.cli_integrity }}
      plugin_integrity: ${{ steps.identity.outputs.plugin_integrity }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Require standalone public CLI checkout
        run: node scripts/standalone-checkout.mjs --ci

      - name: Check secrets and private files
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/anhedral-secret-safety"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --retry 2 --output "$tools/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          GITLEAKS_BINARY="$tools/gitleaks" python3 .github/secret-safety.py
      - name: Enforce Markdown documentation budget
        run: node scripts/check-docs-budget.mjs
      - id: scope
        env:
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          CI_HEAD_BRANCH: ${{ github.head_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
      - name: Setup pnpm
        if: steps.scope.outputs.full == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install CLI dependencies only
        if: steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile CLI
        if: steps.scope.outputs.full == 'true'
        run: pnpm build
      - name: Fast source checks
        if: steps.scope.outputs.full == 'true'
        run: pnpm format:check && pnpm check:hygiene && pnpm check:security && pnpm check:release-policy
      - name: Fast contract smoke tests
        if: steps.scope.outputs.full == 'true'
        run: node --test tests/test-standalone-checkout.test.mjs tests/test-cli-validation.test.mjs tests/test-cli-discovery.test.mjs tests/test-cli-output.test.mjs tests/test-platform-ux.test.mjs tests/test-cli-experience.test.mjs tests/test-completion.test.mjs tests/test-standard.test.mjs tests/test-launch-init.test.mjs tests/test-public-stack.test.mjs tests/test-deployment-contract.test.mjs tests/test-tanstack-platform.test.mjs tests/test-capabilities.test.mjs tests/test-ci-scope.test.mjs tests/test-next-web.test.mjs tests/test-worker-measurement.test.mjs tests/test-runtime-proof-receipt.test.mjs tests/test-dependency-audit.test.mjs tests/test-release-candidate.test.mjs tests/test-release-dispatch.test.mjs tests/test-command-orchestration.test.mjs tests/test-util-exec.test.mjs tests/test-credential-boundary.test.mjs tests/test-stack-update.test.mjs tests/test-release-artifact.test.mjs
      - name: Compiled Anhedral Stack runtime and bundle budget
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_proof
        run: node scripts/tanstack-runtime-smoke.mjs
      - name: Retain Anhedral Stack runtime measurements
        if: always() && github.event_name == 'workflow_dispatch' && inputs.runtime_proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anhedral-stack-runtime
          path: |
            .artifacts/anhedral-stack-runtime/summary.json
            .artifacts/anhedral-stack-runtime/measurements.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Build plugin only for an explicitly requested main candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm plugin:build
      - name: Build and verify Linux release candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ANHEDRAL_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          node scripts/create-release-artifact.mjs
          pnpm release:artifact:verify
          pnpm release:artifact:smoke
      - name: Share verified release candidate for review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Summarize verified candidate
        id: identity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync('.artifacts/release/metadata.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `cli_integrity=${m.integrity}\nplugin_integrity=${m.plugin.integrity}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Release candidate\nSource: ${m.sourceRevision}\n\nCLI: ${m.integrity}\n\nPlugin: ${m.plugin.integrity}\n\nReview this identity before approving the npm environment.\n`);
          JS
