name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          CI_HEAD_BRANCH: ${{ github.head_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
      - name: Setup pnpm
        if: steps.scope.outputs.full == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/native-ui/pnpm-lock.yaml
      - name: Install CLI dependencies only
        if: steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile CLI
        if: steps.scope.outputs.full == 'true'
        run: pnpm build
      - name: Fast source checks
        if: steps.scope.outputs.full == 'true'
        run: pnpm format:check && pnpm check:hygiene && pnpm check:security && pnpm check:release-policy
      - name: Fast contract smoke tests
        if: steps.scope.outputs.full == 'true'
        run: node --test tests/test-cli-validation.test.mjs tests/test-ci-scope.test.mjs tests/test-next-web.test.mjs tests/test-worker-measurement.test.mjs tests/test-dependency-audit.test.mjs tests/test-release-candidate.test.mjs tests/test-util-exec.test.mjs tests/test-native-ui-catalog.test.mjs
      - name: Native component contracts when their source changes
        if: steps.scope.outputs.native == 'true'
        run: |
          pnpm --dir tests/native-ui install --frozen-lockfile --ignore-scripts
          pnpm --dir tests/native-ui typecheck
          pnpm --dir tests/native-ui test
      - name: Compiled Next/OpenNext runtime and bundle budget
        if: steps.scope.outputs.nextRuntime == 'true'
        run: node scripts/next-runtime-smoke.mjs
      - name: Retain Next runtime measurements
        if: always() && steps.scope.outputs.nextRuntime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-runtime
          path: .artifacts/next-runtime/
          if-no-files-found: ignore
          retention-days: 1
      - name: Build plugin only for an explicitly requested main candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm plugin:build
      - name: Build and verify Linux release candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          node scripts/create-release-artifact.mjs
          pnpm release:artifact:verify
          pnpm release:artifact:smoke
      - name: Share verified release candidate for review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
