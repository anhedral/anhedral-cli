name: Release Reviewed Candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      finalize_only:
        description: Finalize an already published exact artifact without another npm publication
        required: false
        default: false
        type: boolean
      cli_integrity:
        description: SHA-512 integrity of the reviewed CLI tarball
        required: true
        type: string
      plugin_integrity:
        description: SHA-512 integrity of the reviewed plugin archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Require reviewed main commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.review.outputs.release_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact reviewed commit
        id: review
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
          REVIEWED_CLI: ${{ inputs.cli_integrity }}
          REVIEWED_PLUGIN: ${{ inputs.plugin_integrity }}
        run: |
          if ! [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The reviewed commit must be an exact SHA"
            exit 1
          fi
          if [ "$FINALIZE_ONLY" = "true" ]; then
            git merge-base --is-ancestor "$REVIEWED_SHA" HEAD || exit 1
          elif [ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ]; then
            echo "The reviewed commit must be the current main commit"
            exit 1
          fi
          if ! [[ "$REVIEWED_CLI" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || ! [[ "$REVIEWED_PLUGIN" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]; then
            echo "Both reviewed artifact integrities must be valid SHA-512 SRI values"
            exit 1
          fi
          echo "release_sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.release_sha }}
        run: |
          PASSED=$(gh run list --workflow ci.yml --branch main --commit "$REVIEWED_SHA" --status success --json headSha,conclusion --jq 'length')
          if ! [[ "$PASSED" =~ ^[1-9][0-9]*$ ]]; then
            echo "The reviewed main commit must pass the lightweight CI gate"
            exit 1
          fi

  release:
    name: Publish reviewed immutable artifacts
    needs: prepare
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      finalize_only: ${{ inputs.finalize_only }}
      cli_integrity: ${{ inputs.cli_integrity }}
      plugin_integrity: ${{ inputs.plugin_integrity }}
