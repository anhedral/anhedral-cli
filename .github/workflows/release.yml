name: Release

on:
  workflow_call:
    inputs:
      candidate_run_id:
        description: Prepared release run (historical runs require finalize-only recovery)
        required: false
        default: ''
        type: string
      release_sha:
        description: Exact commit containing the prepared release version
        required: true
        type: string
      finalize_only:
        description: Finalization requires an already matching published registry artifact
        required: false
        default: false
        type: boolean
      cli_integrity:
        description: Reviewed CLI artifact SHA-512 integrity
        required: true
        type: string
      plugin_integrity:
        description: Reviewed plugin archive SHA-512 integrity
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: .

env:
  RELEASE_NODE_VERSION: '24.21.0'
  ANHEDRAL_EXPECTED_SOURCE_REVISION: ${{ inputs.release_sha }}

concurrency:
  group: npm-publish-anhedral
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'anhedral/anhedral-cli'
    name: Verify existing CI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      integrity: ${{ steps.metadata.outputs.integrity }}
      plugin_integrity: ${{ steps.metadata.outputs.plugin_integrity }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require standalone public CLI checkout
        run: node scripts/standalone-checkout.mjs --ci

      - name: Require the prepared main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
          REVIEWED_CLI: ${{ inputs.cli_integrity }}
          REVIEWED_PLUGIN: ${{ inputs.plugin_integrity }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          if ! [[ "$REVIEWED_CLI" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || ! [[ "$REVIEWED_PLUGIN" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]; then exit 1; fi
          if [ "$FINALIZE_ONLY" = "true" ]; then
            git merge-base --is-ancestor "$RELEASE_SHA" HEAD || exit 1
          elif [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Release commit $RELEASE_SHA is no longer the current main commit"
            exit 1
          fi

      - name: Checkout admitted candidate source for finalization
        if: inputs.finalize_only == true
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Locate successful main CI candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
        run: |
          if [ -n "$CANDIDATE_RUN_ID" ]; then
            test "$CALLER_WORKFLOW" = "anhedral/anhedral-cli/.github/workflows/release-on-main.yml@refs/heads/main" || exit 1
            if [ "$CANDIDATE_RUN_ID" != "$CURRENT_RUN_ID" ]; then
              test "$FINALIZE_ONLY" = "true" || exit 1
              node scripts/release-candidate-run.mjs
            else
              test "$FINALIZE_ONLY" != "true" || exit 1
            fi
            echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID=$(gh run list --workflow ci.yml --branch main --commit "$RELEASE_SHA" --status success --json databaseId,event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful trusted main CI run exists for the reviewed commit"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download immutable main CI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .artifacts/release
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify release artifact
        env:
          ANHEDRAL_EXPECTED_INTEGRITY: ${{ inputs.cli_integrity }}
          ANHEDRAL_EXPECTED_PLUGIN_INTEGRITY: ${{ inputs.plugin_integrity }}
        run: node scripts/verify-release-artifact.mjs .artifacts/release/metadata.json && node scripts/check-release-secrets.mjs .artifacts/release/metadata.json

      - name: Require existing exact publication before finalization
        if: inputs.finalize_only == true
        run: node scripts/check-release-registry.mjs verify .artifacts/release/metadata.json

      - name: Read release metadata
        id: metadata
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('.artifacts/release/metadata.json', 'utf8')).version")
          TARBALL=$(node -p "JSON.parse(require('node:fs').readFileSync('.artifacts/release/metadata.json', 'utf8')).filename")
          INTEGRITY=$(node -p "JSON.parse(require('node:fs').readFileSync('.artifacts/release/metadata.json', 'utf8')).integrity")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          PLUGIN_INTEGRITY=$(node -p "JSON.parse(require('node:fs').readFileSync('.artifacts/release/metadata.json', 'utf8')).plugin.integrity")
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "plugin_integrity=$PLUGIN_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "artifact_name=anhedral-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag from another commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
              echo "$TAG already points to $TAG_COMMIT; refusing to publish $RELEASE_SHA"
              exit 1
            fi
          fi

      - name: Upload verified artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record artifact digest
        run: echo "Artifact digest ${{ steps.artifact.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.finalize_only != true
    name: Publish verified artifact
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false
          persist-credentials: false
          ref: main
      - name: Require standalone public CLI checkout
        run: node scripts/standalone-checkout.mjs --ci

      - name: Require the prepared main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Require OIDC-capable npm
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e "const match = /^(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1]); const minimum = [11, 5, 1]; const actual = match?.slice(1).map(Number); const difference = actual?.findIndex((part, index) => part !== minimum[index]); if (!actual || (difference >= 0 && actual[difference] < minimum[difference])) { throw new Error('npm 11.5.1 or newer is required for trusted publishing') }" "$NPM_VERSION"

      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .artifacts/release

      - name: Recheck artifact integrity
        env:
          ANHEDRAL_EXPECTED_FILENAME: ${{ needs.verify.outputs.tarball }}
          ANHEDRAL_EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          ANHEDRAL_EXPECTED_PLUGIN_INTEGRITY: ${{ needs.verify.outputs.plugin_integrity }}
          ANHEDRAL_EXPECTED_NAME: anhedral
          ANHEDRAL_EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/verify-release-artifact.mjs .artifacts/release/metadata.json

      - name: Check npm registry state
        id: registry
        run: |
          STATE=$(node scripts/check-release-registry.mjs preflight .artifacts/release/metadata.json)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "Registry state before publish: $STATE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish package
        if: steps.registry.outputs.state == 'missing'
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: npm publish "./.artifacts/release/$TARBALL" --ignore-scripts --provenance --registry=https://registry.npmjs.org

      - name: Verify npm registry integrity
        run: node scripts/check-release-registry.mjs verify .artifacts/release/metadata.json

      - name: Summarize publication
        run: |
          echo "npm package: anhedral@${{ needs.verify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "integrity: ${{ needs.verify.outputs.integrity }}" >> "$GITHUB_STEP_SUMMARY"

  tag:
    if: ${{ always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || (inputs.finalize_only == true && needs.publish.result == 'skipped')) }}
    name: Tag and create GitHub release
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout published commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - name: Require standalone public CLI checkout
        # Historical finalization checks out an older public commit, which may
        # predate the standalone helper. Do not require new files in that tree.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, realpathSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync('package.json', 'utf8'));
          if (metadata.name !== 'anhedral' || realpathSync('.') !== realpathSync(process.env.GITHUB_WORKSPACE))
            throw Error('Release finalization must run only in the public CLI checkout.');
          NODE

      - name: Require the published candidate commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Download published artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .artifacts/release

      - name: Recheck published artifact
        env:
          ANHEDRAL_EXPECTED_FILENAME: ${{ needs.verify.outputs.tarball }}
          ANHEDRAL_EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          ANHEDRAL_EXPECTED_PLUGIN_INTEGRITY: ${{ needs.verify.outputs.plugin_integrity }}
          ANHEDRAL_EXPECTED_NAME: anhedral
          ANHEDRAL_EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/verify-release-artifact.mjs .artifacts/release/metadata.json

      - name: Verify the exact artifact is already published
        run: node scripts/check-release-registry.mjs verify .artifacts/release/metadata.json

      - name: Verify declared version
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match published version $EXPECTED_VERSION"
            exit 1
          fi

      - name: Publish immutable plugin source from the verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/publish-plugin-source.mjs .artifacts/release/metadata.json

      - name: Create or verify tag
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
              echo "$TAG points to $TAG_COMMIT instead of published commit $RELEASE_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          VERSION: ${{ needs.verify.outputs.version }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
        run: |
          # Historical completion must never replace the current latest release.
          LATEST_ARGS=()
          if [ "$FINALIZE_ONLY" = "true" ]; then LATEST_ARGS=(--latest=false); fi
          TAG="v$VERSION"
          ASSET=".artifacts/release/$TARBALL"
          METADATA=".artifacts/release/metadata.json"
          PLUGIN=".artifacts/release/anhedral-plugin-$VERSION.zip"
          PLUGIN_METADATA=".artifacts/release/plugin-metadata.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              gh release upload "$TAG" \
                "$ASSET#npm package tarball" \
                "$METADATA#release integrity metadata" \
                "$PLUGIN#Anhedral plugin" \
                "$PLUGIN_METADATA#plugin integrity metadata" \
                --clobber
              gh release edit "$TAG" --draft=false "${LATEST_ARGS[@]}"
            fi
          else
            gh release create "$TAG" \
              --draft "${LATEST_ARGS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
            gh release upload "$TAG" \
              "$ASSET#npm package tarball" \
              "$METADATA#release integrity metadata" \
              "$PLUGIN#Anhedral plugin" \
              "$PLUGIN_METADATA#plugin integrity metadata"
            gh release edit "$TAG" --draft=false "${LATEST_ARGS[@]}"
          fi

          DOWNLOAD_DIR=$(mktemp -d "$RUNNER_TEMP/anhedral-release.XXXXXX")
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          gh release download "$TAG" \
            --dir "$DOWNLOAD_DIR" \
            --pattern "$TARBALL" \
            --pattern metadata.json \
            --pattern "anhedral-plugin-$VERSION.zip" \
            --pattern plugin-metadata.json
          cmp "$ASSET" "$DOWNLOAD_DIR/$TARBALL"
          cmp "$METADATA" "$DOWNLOAD_DIR/metadata.json"
          cmp "$PLUGIN" "$DOWNLOAD_DIR/anhedral-plugin-$VERSION.zip"
          cmp "$PLUGIN_METADATA" "$DOWNLOAD_DIR/plugin-metadata.json"
          node scripts/verify-release-artifact.mjs "$DOWNLOAD_DIR/metadata.json"
