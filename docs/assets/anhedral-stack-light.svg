<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">Anhedral Stack</title>
<desc id="desc">One stack begins with TanStack Start and source-owned shadcn UI, using OJ development servers and builds. Add Hono, Better Auth and Drizzle with Cloudflare D1 together as one backend. Then add private Cloudflare R2 storage or Stripe payments independently. Source generation does not provision services or deploy an application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#5d6977"/></marker></defs>
<rect width="1600" height="1040" fill="#f6f8fa"/>
<text x="80" y="85" fill="#202830" font-size="42">Anhedral Stack</text>
<text x="80" y="130" fill="#5d6977" font-size="24">Start with web UI. Add services when needed.</text>
<rect x="460" y="180" width="680" height="210" rx="18" fill="#ffffff" stroke="#c6d0d9" stroke-width="2"/>
<text x="800" y="235" text-anchor="middle" fill="#202830" font-size="30">TanStack Start + shadcn</text>
<text x="800" y="280" text-anchor="middle" fill="#5d6977" font-size="22">OJ dev server, hot reload and builds</text>
<text x="800" y="312" text-anchor="middle" fill="#5d6977" font-size="22">Server rendering and typed server functions</text>
<text x="800" y="344" text-anchor="middle" fill="#5d6977" font-size="22">anhedral init</text>
<path d="M800 392V453" fill="none" stroke="#5d6977" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="460" y="470" width="680" height="210" rx="18" fill="#ffffff" stroke="#c6d0d9" stroke-width="2"/>
<text x="800" y="525" text-anchor="middle" fill="#202830" font-size="30">Hono + Better Auth + Drizzle / D1</text>
<text x="800" y="570" text-anchor="middle" fill="#5d6977" font-size="22">Backend, authentication and database together</text>
<text x="800" y="602" text-anchor="middle" fill="#5d6977" font-size="22">Cloudflare Workers service binding</text>
<text x="800" y="634" text-anchor="middle" fill="#5d6977" font-size="22">anhedral add backend</text>
<path d="M660 682L445 765M940 682L1155 765" fill="none" stroke="#5d6977" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="160" y="790" width="570" height="160" rx="18" fill="#ffffff" stroke="#c6d0d9" stroke-width="2"/>
<text x="445" y="845" text-anchor="middle" fill="#202830" font-size="30">Private storage</text>
<text x="445" y="890" text-anchor="middle" fill="#5d6977" font-size="22">Cloudflare R2</text>
<text x="445" y="922" text-anchor="middle" fill="#5d6977" font-size="22">anhedral add r2</text>
<rect x="870" y="790" width="570" height="160" rx="18" fill="#ffffff" stroke="#c6d0d9" stroke-width="2"/>
<text x="1155" y="845" text-anchor="middle" fill="#202830" font-size="30">Payments</text>
<text x="1155" y="890" text-anchor="middle" fill="#5d6977" font-size="22">Stripe subscriptions and entitlements</text>
<text x="1155" y="922" text-anchor="middle" fill="#5d6977" font-size="22">anhedral add stripe</text>
<text x="800" y="1000" text-anchor="middle" fill="#5d6977" font-size="20">Editable source. Provider configuration and deployment are separate.</text>
</svg>
